<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABESHA STORE - الإدارة</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #061a35;
      color: white;
      padding: 20px;
    }

    .box {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      color: white;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #1d5fae;
      background: #0b2749;
      color: white;
      font-size: 16px;
    }

    button {
      padding: 12px 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      background: #0b63ce;
      color: white;
      font-size: 16px;
    }

    #status {
      margin: 15px 0;
    }

    .product {
      background: #0b2749;
      border: 1px solid #163f6b;
      border-radius: 10px;
      padding: 15px;
      margin: 10px 0;
    }

    .type {
      color: #8bbcff;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="box">

  <h1>ABESHA STORE — الإدارة</h1>

  <div id="loginBox">
    <p>أدخل مفتاح الإدارة:</p>

    <input
      id="adminKey"
      type="password"
      placeholder="ADMIN KEY"
    >

    <button onclick="loadCatalog()">
      دخول
    </button>
  </div>

  <div id="status"></div>

  <input
    id="search"
    type="text"
    placeholder="ابحث عن منتج..."
    style="display:none;"
    oninput="renderProducts()"
  >

  <div id="products"></div>

</div>

<script>

let products = [];

async function loadCatalog() {

  const key = document.getElementById("adminKey").value.trim();

  if (!key) {
    alert("أدخل مفتاح الإدارة");
    return;
  }

  sessionStorage.setItem("ABESHA_ADMIN_KEY", key);

  document.getElementById("status").textContent =
    "جاري تحميل الكتالوج...";

  try {

    const response = await fetch("/api/admin/catalog", {
      headers: {
        "X-Admin-Key": key
      }
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "فشل الدخول");
    }

    products = data.products || [];

    document.getElementById("loginBox").style.display = "none";

    document.getElementById("search").style.display = "block";

    document.getElementById("status").textContent =
      "تم تحميل " + products.length + " منتج";

    renderProducts();

  } catch (error) {

    sessionStorage.removeItem("ABESHA_ADMIN_KEY");

    document.getElementById("status").textContent =
      "فشل الدخول: " + error.message;
  }
}

function renderProducts() {

  const search =
    document.getElementById("search").value
      .trim()
      .toLowerCase();

  const filtered = products.filter(product => {

    const name = (product.name || "").toLowerCase();

    const id = (product.id || "").toLowerCase();

    return name.includes(search) || id.includes(search);
  });

  document.getElementById("products").innerHTML =
  filtered.slice(0, 100).map(product => `
    <div class="product">

      <strong>${escapeHtml(product.name || "")}</strong>

      <div class="type">
        النوع: ${escapeHtml(product.type || "")}
      </div>

      <div>
        ID: ${escapeHtml(product.id || "")}
      </div>

      <button
        onclick="openProductOffers('${escapeHtml(product.id || "")}', '${escapeHtml(product.type || "")}', '${escapeHtml(product.name || "")}')"
        style="
          margin-top:12px;
          padding:10px 16px;
          border-radius:8px;
          border:1px solid #1976ff;
          background:#0b3d78;
          color:white;
          cursor:pointer;
        "
      >
        إدارة العروض
      </button>

    </div>
  `).join("");

  if (!filtered.length) {
    document.getElementById("products").innerHTML =
      "<p>لا توجد نتائج.</p>";
  }
}

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}
async function openProductOffers(productId, productType, productName) {
  try {
    const name = productName || productId;

    document.getElementById("status").innerText =
      "جاري تحميل عروض " + name + "...";

    let url = "";

    if (
      String(productType || "").toLowerCase().includes("gift")
    ) {
      url =
        "/api/fazer/giftcards/cards?category_id=" +
        encodeURIComponent(productId);
    } else {
      url =
        "/api/fazer/topups/offers?category_id=" +
        encodeURIComponent(productId);
    }

    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok || data.ok === false) {
      throw new Error(
        data.error || data.message || "تعذر تحميل العروض"
      );
    }

    const offers =
      data.offers ||
      data.cards ||
      data.items ||
      [];

    if (!offers.length) {
      alert(
        "المنتج: " +
        name +
        "\n\nلم يتم العثور على عروض متاحة حاليًا."
      );

      document.getElementById("status").innerText = "";
      return;
    }

    const settingsResponse = await fetch("/api/catalog/published");
const settingsData = await settingsResponse.json();

const pricing = settingsData.pricing || {};

const USD_TO_SDG = Number(pricing.usdToSdg) || 8300;
    const REFERENCE_USD_TO_SDG = Number(pricing.referenceUsdToSdg) || 8275;
const MARKUP = Number(pricing.markup) || 0.10;

    let message =
      "📦 " + name + "\n\n" +
      "سعر الصرف: 1 USD = " +
      USD_TO_SDG.toLocaleString("en-US") +
      " SDG\n" +
      "الزيادة: 10%\n\n" +
      "العروض:\n\n";

    offers.forEach((offer, index) => {
      const usd = Number(
        offer.price_usd || offer.price || 0
      );

      

const cost = usd * USD_TO_SDG;

let sale = null;

// استخدام السعر النهائي المحدد للمنتج إذا كان موجوداً
if (productType === "topup" && pricing.finalPrices) {
  const productPrices = pricing.finalPrices[productId];

  if (productPrices) {
    const offerText = String(
      offer.name ||
      offer.title ||
      offer.label ||
      offer.description ||
      ""
    ).toLowerCase();

    const priceKeys = Object.keys(productPrices);

    const matchedKey = priceKeys.find(key => {
      const quantity = key.replace("_uc", "").replace(/_/g, " ");
      return offerText.includes(quantity);
    });

    if (matchedKey) {
      sale = Number(productPrices[matchedKey]);
    }
  }
}

// إذا لم يوجد سعر نهائي محدد، استخدم التسعير التلقائي
if (!sale) {
  const referenceSale =
    usd * REFERENCE_USD_TO_SDG * (1 + MARKUP);

  const minimumSale =
    cost * 1.05;

  sale = Math.max(referenceSale, minimumSale);
}

const profit = sale - cost;

      message +=
        (index + 1) + ". " +
        (offer.name || offer.title || offer.id || "عرض") +
        "\n" +
        "سعر الدولار الامريكي: $" +
        usd.toFixed(4) +
        "\n" +
        "التكلفة: " +
        Math.round(cost).toLocaleString("en-US") +
        " SDG\n" +
        "البيع المقترح: " +
        Math.round(sale).toLocaleString("en-US") +
        " SDG\n" +
        "الربح: " +
        Math.round(profit).toLocaleString("en-US") +
        " SDG\n\n";
    });

    alert(message);

    document.getElementById("status").innerText =
      "تم تحميل " +
      offers.length +
      " عرضًا لـ " +
      name;

  } catch (error) {
    console.error(error);

    alert(
      "حدث خطأ أثناء تحميل العروض:\n\n" +
      error.message
    );

    document.getElementById("status").innerText =
      "تعذر تحميل العروض";
  }
}
</script>

</body>
</html>
